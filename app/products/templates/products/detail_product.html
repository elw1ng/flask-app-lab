{% extends "base.html" %}

{% block title %}{{ product.name }} · FlaskApp{% endblock %}

{% block content %}
  <article class="content-card product-detail">
    <p class="eyebrow">PRODUCT · {{ product.id }}</p>
    <h1>{{ product.name }}</h1>
    <p class="product-price">${{ product.price }}</p>
    <p>{{ product.description }}</p>
    <a class="btn btn-accent" href="{{ url_for('products.index') }}">Back to products</a>
  </article>
{% endblock %}
